{% extends "base.html" %}{% block title %}Attendance{% endblock %}{% block heading %}Attendance Register{% endblock %}
{% block content %}<section class="panel"><form method="post"><div class="toolbar"><div><label>Date</label><input type="date" name="attend_date" value="{{selected_date}}"></div><button>Save Attendance</button></div>
<div class="table-wrap"><table><tr><th>Admission</th><th>Student</th><th>Class</th><th>Status</th><th>Note</th></tr>{% for s in students %}<tr><td>{{s.admission_no}}</td><td>{{s.first_name}} {{s.last_name}}</td><td>{{s.class_name}}</td><td><select name="status_{{s.id}}"><option {% if s.att_status=='Present' %}selected{% endif %}>Present</option><option {% if s.att_status=='Absent' %}selected{% endif %}>Absent</option><option {% if s.att_status=='Late' %}selected{% endif %}>Late</option><option {% if s.att_status=='Excused' %}selected{% endif %}>Excused</option></select></td><td><input name="note_{{s.id}}" value="{{s.note}}" placeholder="Optional"></td></tr>{% endfor %}</table></div></form></section>{% endblock %}
