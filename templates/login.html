<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MACAD Login</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head>
<body class="login-page"><div class="login-card"><img src="{{url_for('static',filename='logo.png')}}" class="login-logo"><h1>MAPEZA ACADEMY</h1><p>School Management Portal</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}
<form method="post"><label>Username</label><input name="username" required autofocus><label>Password</label><input type="password" name="password" required><button>Sign In</button></form>
<div class="hint">First-time local login: <b>admin</b> / <b>admin123</b>. Change the password immediately in Settings.</div></div></body></html>
