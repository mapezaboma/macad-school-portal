{% extends "base.html" %}{% block title %}Edit Student{% endblock %}{% block heading %}Edit Student{% endblock %}
{% block content %}<section class="panel"><form method="post" class="formgrid">
<input name="admission_no" value="{{student.admission_no}}" required><input name="first_name" value="{{student.first_name}}" required><input name="last_name" value="{{student.last_name}}" required>
<select name="gender">{% for x in ['Female','Male','Other'] %}<option {% if student.gender==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select>
<input type="date" name="dob" value="{{student.dob}}"><input name="class_name" value="{{student.class_name}}" placeholder="Form / Class"><input name="guardian" value="{{student.guardian}}"><input name="phone" value="{{student.phone}}"><input name="address" value="{{student.address}}">
<select name="status"><option {% if student.status=='Active' %}selected{% endif %}>Active</option><option {% if student.status=='Inactive' %}selected{% endif %}>Inactive</option></select>
<button>Save Changes</button><a class="cancel-btn" href="{{url_for('students')}}">Cancel</a></form></section>{% endblock %}
